# Integración continua: corre en cada pull request y en cada push a develop y main.
# Las reglas de protección de develop y main exigen que Pruebas, Imagen Docker y Autoría de commits
# pasen antes del merge.
# Despliegue continuo: al mergear en main, y solo con esos tres jobs en verde, publica la imagen
# en GHCR y Render la despliega.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# El workflow solo lee el repositorio.
permissions:
  contents: read

# Un push nuevo al mismo PR o rama cancela la ejecución anterior, que ya quedó vieja.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Valores ficticios: env.js exige las variables al cargar, pero las pruebas no se conectan a
    # ninguna base (usan ejecutores simulados). No detectan SQL roto: eso se prueba con .http y SSMS.
    env:
      PORT: "3000"
      DB_SERVER: localhost
      DB_PORT: "1433"
      DB_NAME: ZacariasGuerra
      DB_USER: zg_app
      DB_PASSWORD: ficticia-ci
      DB_CONFIAR_CERTIFICADO: "true"
      JWT_SECRETO: ficticio-ci
      JWT_EXPIRA: 8h
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validar compose.yaml
        # Compose exige estas variables al interpolar; acá solo se comprueba el archivo.
        env:
          DB_PASSWORD: Ficticia.CI.1
          JWT_SECRETO: ficticio-ci
          MSSQL_SA_PASSWORD: Ficticia.CI.1
          SEED_ADMIN_CORREO: admin@ci.local
          SEED_ADMIN_PASSWORD: Ficticia.CI.1
        run: docker compose config --quiet
      - name: Construir la imagen
        run: docker build --tag reservas-zg:ci .
      - name: Prueba de humo
        # Levanta el contenedor sin base y comprueba que el frontend y la API responden.
        run: bash .github/scripts/prueba-humo.sh reservas-zg:ci

  autoria:
    name: Autoría de commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rechazar coautoría o generación automática en los mensajes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Cada commit tiene que ser de un solo autor: es lo que se evalúa en el repositorio.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            rango="$HEAD -1"
          else
            rango="$BASE..$HEAD"
          fi
          encontrados=0
          for commit in $(git rev-list $rango); do
            if git log -1 --format=%B "$commit" | grep -qiE '^co-authored-by:|generated with'; then
              echo "::error::$(git log -1 --format='%h %s' "$commit"): el mensaje declara coautoría o generación automática"
              encontrados=1
            fi
          done
          if [ "$encontrados" -eq 0 ]; then
            echo "Revisados $(git rev-list --count $rango) commits: todos con un solo autor."
          fi
          exit "$encontrados"

  publicar:
    name: Publicar imagen
    # Solo un push a main (el merge de un PR); en PRs y en develop el job queda omitido.
    # No es un check obligatorio: si lo fuera, los PRs lo esperarían para siempre.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pruebas, imagen, autoria]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Solo este job puede escribir en el registro de paquetes.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen con sus etiquetas
        run: |
          # GHCR exige el nombre en minúsculas: ghcr.io/mattmnz/reservas-zacarias-guerra.
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGEN=$imagen" >> "$GITHUB_ENV"
          echo "ETIQUETA_SHA=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$imagen:latest" \
            --tag "$imagen:sha-${GITHUB_SHA::7}" .
      - name: Prueba de humo
        # Se prueba la misma imagen que se sube: no se vuelve a construir.
        run: bash .github/scripts/prueba-humo.sh "$IMAGEN:latest"
      - name: Iniciar sesión en GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Subir la imagen
        run: |
          # Primero la etiqueta del commit: latest se mueve solo si la otra subió bien.
          docker push "$IMAGEN:$ETIQUETA_SHA"
          docker push "$IMAGEN:latest"
          echo "Publicada $IMAGEN con las etiquetas latest y $ETIQUETA_SHA."

  despliegue:
    name: Despliegue
    # Solo un push a main (el merge de un PR); en PRs y en develop el job queda omitido.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pruebas, imagen, autoria, publicar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar el despliegue en Render
        env:
          # Con esta URL cualquiera puede desplegar: va como secreto y nunca se imprime.
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # Render despliega la imagen latest que acaba de publicar el job anterior.
          curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render recibió el pedido de despliegue de $GITHUB_SHA."
