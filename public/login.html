<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Zacarías Guerra</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/paginas/login.js"></script>
  </head>
  <body>
    <main class="contenedor contenedor--angosto">
      <h1>Iniciar sesión</h1>
      <p>Reservas del Complejo Deportivo Zacarías Guerra.</p>
      <p class="aviso aviso--exito" data-registrado role="status" hidden>
        Cuenta creada. Ya puede iniciar sesión.
      </p>
      <p class="aviso aviso--error" data-error role="alert" hidden></p>
      <form class="tarjeta" data-formulario>
        <label class="campo">
          <span class="campo__etiqueta">Correo</span>
          <input type="email" name="correo" autocomplete="email" required>
        </label>
        <label class="campo">
          <span class="campo__etiqueta">Contraseña</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="boton boton--bloque" type="submit">Iniciar sesión</button>
      </form>
      <p>¿No tiene cuenta? <a href="/registro.html">Registrarse</a></p>
    </main>
  </body>
</html>
