<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro · Zacarías Guerra</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/paginas/registro.js"></script>
  </head>
  <body>
    <main class="contenedor contenedor--angosto">
      <h1>Crear cuenta</h1>
      <noscript><p class="aviso aviso--error">Se necesita JavaScript para registrarse.</p></noscript>
      <p class="aviso aviso--error" data-error role="alert" hidden></p>
      <form class="tarjeta" method="post" data-formulario>
        <label class="campo">
          <span class="campo__etiqueta">Nombre</span>
          <input type="text" name="nombre" autocomplete="name" maxlength="100" required>
        </label>
        <label class="campo">
          <span class="campo__etiqueta">Correo</span>
          <input type="email" name="correo" autocomplete="email" maxlength="254" required>
        </label>
        <label class="campo">
          <span class="campo__etiqueta">Contraseña</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          <span class="campo__ayuda">Mínimo 8 caracteres.</span>
        </label>
        <label class="campo">
          <span class="campo__etiqueta">Teléfono (opcional)</span>
          <input type="tel" name="telefono" autocomplete="tel" maxlength="20">
        </label>
        <p class="aviso aviso--info" data-preparando>Preparando el formulario… Si el botón no se habilita, recargue la página.</p>
        <button class="boton boton--bloque" type="submit" disabled>Crear cuenta</button>
      </form>
      <p>¿Ya tiene cuenta? <a href="/login.html">Iniciar sesión</a></p>
    </main>
  </body>
</html>
